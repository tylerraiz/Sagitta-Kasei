@REFLECTION_CONFIG[default]:NEEDS[TexturesUnlimited]
{
	%enabled = true
}


KSP_MODEL_SHADER
{
	name = EDB-KaseiNUpper
	model = EDBMods/Parts/SagittaNeo/KaseiNUpper
	TEXTURE
    {
        shader = SSTU/PBR/Metallic
		mesh = Sphere
		mesh = Sphere.001
		mesh = TankMetal
		mesh = Vernier.000
		mesh = Vernier.001
		mesh = Vernier.002
		mesh = Vernier.003
		
        PROPERTY
		{
			name = _Color
			color = 1.0,1.0,1.0  //higher numbers are lighter
		}
		PROPERTY
		{
			name = _Metal
			float = 0.7 // 0>less metallic 1>more metallic(mirror finish)
		}
		PROPERTY
			{
			name = _Smoothness
			float = 0.7  // 1>less blurry 0>more blurry
		}
	}
}

