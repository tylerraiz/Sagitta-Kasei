+PART[EDB-KaseiNLower]:FOR[RealismOverhaul]
{
	@name = EDB-KaseiIILower
	%RSSROConfig = True
	
	@title = Kasei II Lower Stage
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/SagittaNeo/KaseiNLower
		scale = 1.2,1.2,1.2
	}
	
	@scale = 1.2
	@mass = 107.38
	
	@node_stack_engine1 = 2.1, -29.75, 2.1, 0.0, -1.0, 0.0, 2
	@node_stack_engine2 = 2.1, -29.75, -2.1, 0.0, -1.0, 0.0, 2
	@node_stack_engine3 = -2.1, -29.75, 2.1, 0.0, -1.0, 0.0, 2
	@node_stack_engine4 = -2.1, -29.75, -2.1, 0.0, -1.0, 0.0, 2
