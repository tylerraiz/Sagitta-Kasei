	node_stack_engine6 = -2.97, -29.75, 0.0, 0.0, -1.0, 0.0, 2
	node_stack_engine7 = 0.0, -29.75, 2.97, 0.0, -1.0, 0.0, 2
	node_stack_engine8 = 0.0, -29.75, -2.97, 0.0, -1.0, 0.0, 2
	
	@maxTemp = 773
	%skinMaxTemp = 2000
	%heatConductivity = 0.01		
	%skinInternalConductionMult = 0.005	
	%skinSkinConductionMult = 0.1
	%emissiveConstant = 0.95	
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 4776600.0
		type = Cryogenic
		basemass = -1
		
		TANK
		{
			name = LqdHydrogen
			amount = 3645024.0
			maxAmount = 3645022.0
		}
		TANK
		{
			name = LqdOxygen
			amount = 1131576.0
			maxAmount = 1131576.0
		}
	}
	
	
}

